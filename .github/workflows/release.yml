# Pushing a tag like v0.2.0 builds the signed APK and the Mac app and publishes them as a GitHub Release.
# The apps' update checks read the latest release, and show the tag message as the update notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # checkout turns annotated tags into lightweight ones, which would lose the release notes.
      - name: Fetch the tag message
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' android/app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersion $version in android/app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the signed APK
        working-directory: android
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: gitnotebook
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_KEYSTORE"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
          rm "$RELEASE_KEYSTORE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="jitnote-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "$VERSION" --notes-from-tag

  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install libgit2
      - run: scripts/build-mac.sh --test
      - run: scripts/build-mac.sh

      # The DMG is what people download; the ZIP serves the update check of 0.3.0, which only knows ZIPs.
      - name: Add the Mac app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "mac/build/Jitnote-mac-apple-silicon-$version.dmg" "mac/build/Jitnote-mac-apple-silicon-$version.zip"
