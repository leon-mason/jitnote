# Pushing a tag like v0.2.0 builds the signed APK, the Mac app and the Windows 11 package,
# and publishes them as one GitHub Release. Already-released tags are not rebuilt for Windows.
# The apps' update checks read the latest release, and show the tag message as the update notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # checkout turns annotated tags into lightweight ones, which would lose the release notes.
      - name: Fetch the tag message
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' android/app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersion $version in android/app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the signed APK
        working-directory: android
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          # The key inside the keystore was created as "gitnotebook" and keeps that name.
          RELEASE_KEY_ALIAS: gitnotebook
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_KEYSTORE"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
          rm "$RELEASE_KEYSTORE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="jitnote-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "$VERSION" --notes-from-tag

  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install libgit2
      - run: scripts/build-mac.sh --test
      - run: scripts/build-mac.sh

      # Only the DMG: every Mac version from 0.4.0 on picks it. 0.3.0, which only knew ZIPs, is no longer served.
      - name: Add the Mac app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "mac/build/Jitnote-mac-apple-silicon-$version.dmg"

  windows:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: scripts/build-windows.sh --test
      - run: scripts/build-windows.sh
      # The exe is what people download and what 0.9.0 and later update to; the zip serves the update
      # check of 0.7.0 and 0.8.0, which only knows zips.
      - name: Add the Windows app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "windows/build/Jitnote-windows-x64-$version.exe" "windows/build/Jitnote-windows-x64-$version.zip"
